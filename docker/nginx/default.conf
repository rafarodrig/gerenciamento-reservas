server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # Redireciona tudo para o Laravel, exceto arquivos reais
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processa arquivos PHP com FastCGI (PHP-FPM via serviço `app`)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Bloqueia arquivos .htaccess (não usados no Nginx)
    location ~ /\.ht {
        deny all;
    }

    # Suporte para arquivos estáticos com cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Permite acesso à API do Vite dev server (HMR)
    location /@vite/ {
        proxy_pass http://vite-dev:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite HMR (Hot Module Replacement) WebSocket
    location /socket.io/ {
        proxy_pass http://vite-dev:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
